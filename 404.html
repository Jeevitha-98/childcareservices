
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found - Stackly Childcare</title>

    <style>
        :root {
            --text-pure-black: #000000;
            --text-charcoal: #2B2B2B;
            --text-muted-gray: #627A78;

            --accent-teal: #00A699;
            --accent-teal-hover: #00877D;

            --border-color-dim: #E2EBEA;
            --surface-white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background-color: #FFFDF9;
            color: var(--text-charcoal);

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            overflow: hidden;
        }

        /* ===============================
           MAIN 404 WRAPPER
        =============================== */

        .error-page-macro-wrapper {
            width: 100%;
            padding: 20px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-content-card {
            width: 100%;
            max-width: 480px;

            padding: 50px 40px;

            background-color: var(--surface-white);

            border: 1px solid #FAF3E5;
            border-radius: 28px;

            text-align: center;

            box-shadow:
                0 12px 35px rgba(0, 166, 153, 0.04);
        }

        /* ===============================
           404 ILLUSTRATION
        =============================== */

        .error-vector-illustration {
            width: 100%;
            max-width: 240px;

            margin: 0 auto 30px auto;
        }

        .error-vector-illustration svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ===============================
           ERROR TEXT
        =============================== */

        .error-text-panel h1 {
            font-size: 2.2rem;
            font-weight: 900;

            color: var(--text-pure-black);

            letter-spacing: -1px;
            line-height: 1.2;

            margin-bottom: 12px;
        }

        .error-text-panel p {
            font-size: 1rem;
            line-height: 1.55;

            color: var(--text-muted-gray);
            font-weight: 500;

            margin-bottom: 35px;
        }

        /* ===============================
           BUTTON ROW
        =============================== */

        .error-action-buttons-row {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 16px;
        }

        .error-btn {
            width: 100%;

            padding: 14px 20px;

            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 800;

            border-radius: 12px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            text-decoration: none;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .error-btn svg {
            flex-shrink: 0;
        }

        /* ===============================
           BACK BUTTON
        =============================== */

        .secondary-btn {
            background-color: #FAFAFA;

            color: var(--text-charcoal);

            border: 1px solid var(--border-color-dim);
        }

        .secondary-btn:hover {
            background-color: var(--surface-white);

            border-color: #BCD3D1;

            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.05);
        }

        /* ===============================
           HOME BUTTON
        =============================== */

        .primary-btn {
            background-color: var(--accent-teal);

            color: #FFFFFF;

            border: none;

            box-shadow:
                0 4px 12px rgba(0, 166, 153, 0.15);
        }

        .primary-btn:hover {
            background-color: var(--accent-teal-hover);

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(0, 166, 153, 0.20);
        }

        /* ===============================
           MOBILE
        =============================== */

        @media (max-width: 520px) {

            body {
                overflow-y: auto;
                padding: 20px 0;
            }

            .error-content-card {
                padding: 35px 20px;
                border-radius: 20px;
            }

            .error-text-panel h1 {
                font-size: 1.8rem;
            }

            .error-text-panel p {
                font-size: 0.92rem;
                margin-bottom: 25px;
            }

            .error-action-buttons-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .error-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         MASTER 404 PAGE
    ========================================== -->

    <div class="error-page-macro-wrapper">

        <div class="error-content-card">

            <!-- =========================================
                 404 ILLUSTRATION
            ========================================== -->

            <div class="error-vector-illustration">

                <svg
                    viewBox="0 0 200 160"
                    width="100%"
                    height="100%"
                    aria-label="404 illustration"
                    role="img"
                >

                    <!-- Cloud -->
                    <path
                        d="M30,70
                           Q10,65 15,45
                           Q15,20 42,20
                           Q58,5 78,12
                           Q100,2 115,25
                           Q135,25 130,52
                           Q140,72 120,78
                           Q115,95 88,90
                           Q62,100 42,85
                           Q20,90 30,70 Z"
                        fill="#F0F9F9"
                        stroke="#00A699"
                        stroke-width="2"
                        stroke-dasharray="4,4"
                    />

                    <!-- 404 Blocks -->

                    <g transform="translate(25, 30)">

                        <!-- 4 -->
                        <rect
                            x="10"
                            y="30"
                            width="28"
                            height="50"
                            rx="6"
                            fill="#E6F6F5"
                            stroke="#00A699"
                            stroke-width="3"
                        />

                        <path
                            d="M20,45 L20,65
                               M15,55 L33,55"
                            stroke="#00A699"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                        <!-- 0 -->
                        <circle
                            cx="65"
                            cy="55"
                            r="24"
                            fill="#FFF6E0"
                            stroke="#FFB400"
                            stroke-width="3"
                        />

                        <circle
                            cx="65"
                            cy="55"
                            r="10"
                            fill="#FFFFFF"
                            stroke="#FFB400"
                            stroke-width="2"
                            stroke-dasharray="3,3"
                        />

                        <!-- 4 -->
                        <rect
                            x="105"
                            y="30"
                            width="28"
                            height="50"
                            rx="6"
                            fill="#FFEBEB"
                            stroke="#FF5A5F"
                            stroke-width="3"
                        />

                        <path
                            d="M115,45 L115,65
                               M110,55 L128,55"
                            stroke="#FF5A5F"
                            stroke-width="3"
                            stroke-linecap="round"
                        />

                    </g>

                    <!-- Fallen Pieces -->

                    <path
                        d="M40,115 L55,115 L48,102 Z"
                        fill="#FFE3C2"
                        stroke="#FFB400"
                        stroke-width="2"
                    />

                    <rect
                        x="135"
                        y="105"
                        width="14"
                        height="14"
                        rx="3"
                        fill="#E8F5E9"
                        stroke="#7CB342"
                        stroke-width="2"
                        transform="rotate(15 142 112)"
                    />

                    <!-- Floor -->

                    <line
                        x1="15"
                        y1="120"
                        x2="185"
                        y2="120"
                        stroke="#CCD7D6"
                        stroke-width="2.5"
                        stroke-linecap="round"
                    />

                </svg>

            </div>

            <!-- =========================================
                 ERROR MESSAGE
            ========================================== -->

            <div class="error-text-panel">

                <h1>Blocks Misplaced!</h1>

                <p>
                    The page you're looking for couldn't be found.
                    It may have moved, been removed, or is temporarily unavailable.
                </p>

            </div>

            <!-- =========================================
                 ACTION BUTTONS
            ========================================== -->

            <div class="error-action-buttons-row">

                <!-- BACK -->
                <button
                    type="button"
                    class="error-btn secondary-btn"
                    onclick="executeHistoricalPageBack()"
                >

                    <svg
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <line
                            x1="19"
                            y1="12"
                            x2="5"
                            y2="12"
                        />

                        <polyline
                            points="12 19 5 12 12 5"
                        />

                    </svg>

                    Go Back

                </button>


                <!-- HOME -->
                <a
                    href="index.html"
                    class="error-btn primary-btn"
                    onclick="executeHomeNavigation(event)"
                >

                    <svg
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
                        />

                        <polyline
                            points="9 22 9 12 15 12 15 22"
                        />

                    </svg>

                    Return Home

                </a>

            </div>

        </div>

    </div>


    <script>

        /* =====================================================
           STACKLY 404 SMART NAVIGATION
        ===================================================== */

        function executeHistoricalPageBack() {

            /*
             * First priority:
             * Restore the exact page/section saved
             * before navigating to 404.
             */

            const savedSectionUrl =
                localStorage.getItem("stackly_last_section_url");


            /*
             * Make sure the saved URL is actually useful.
             */

            if (
                savedSectionUrl &&
                !savedSectionUrl.includes("404.html") &&
                !savedSectionUrl.includes("login.html")
            ) {

                window.location.href = savedSectionUrl;

                return;
            }


            /*
             * Second priority:
             * Use browser history.
             */

            if (window.history.length > 1) {

                window.history.back();

                return;
            }


            /*
             * Final fallback:
             * Go to homepage.
             */

            window.location.href = "index.html";
        }


        /* =====================================================
           HOME NAVIGATION
        ===================================================== */

        function executeHomeNavigation(event) {

            /*
             * Clear the previous section because the user
             * explicitly chose Home.
             */

            localStorage.removeItem("stackly_last_section_url");


            /*
             * Allow normal index.html navigation.
             */

        }


        /* =====================================================
           404 PAGE INITIALIZATION
        ===================================================== */

        document.addEventListener("DOMContentLoaded", function () {

            /*
             * Never allow 404.html to become the saved
             * "previous page".
             */

            const currentPage =
                window.location.pathname.toLowerCase();

            if (currentPage.includes("404.html")) {

                /*
                 * Keep the existing saved section untouched.
                 * This is important for the Back button.
                 */

                console.log(
                    "Stackly 404 loaded. Previous section preserved."
                );
            }

        });

    </script>

</body>
</html>
